<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Mossa Jehad</title>
	<link rel="stylesheet" href="https://unpkg.com/98.css@0.1.4/build/98.css" />
	<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23008080'/%3E%3Crect x='4' y='4' width='24' height='24' fill='%23c0c0c0'/%3E%3Crect x='6' y='6' width='20' height='6' fill='%23000080'/%3E%3C/svg%3E" data-src="https://i.ibb.co/pvXqCmjN/logo.png">
	<link rel="stylesheet" href="styles/style.css" />
</head>
	<body id="body">
		<div id="desktop">
			<div id="icons">
				<div id="about-me" onclick="openWindow('about-me')" >
					<img class="desktop-icon" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='4' width='24' height='17' fill='%23dfdfdf' stroke='%23000'/%3E%3Crect x='7' y='7' width='18' height='11' fill='%23008080'/%3E%3Crect x='8' y='25' width='16' height='3' fill='%23dfdfdf' stroke='%23000'/%3E%3C/svg%3E" data-src="https://i.ibb.co/rKC3TSMS/about-me.png" data-fallback="about-me" alt="About me" width="46" height="46">
					<p class="labels">About me</p>
				</div>
				<div id="resume" onclick="openWindow('resume')" >
					<img class="desktop-icon" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='7' y='4' width='18' height='24' fill='%23fff' stroke='%23000'/%3E%3Crect x='9' y='7' width='10' height='3' fill='%23000080'/%3E%3Crect x='9' y='13' width='14' height='2' fill='%23808080'/%3E%3Crect x='9' y='18' width='14' height='2' fill='%23808080'/%3E%3C/svg%3E" data-src="https://i.ibb.co/0pKk6xjy/resume.png" data-fallback="resume" alt="Resume" width="46" height="46">
					<p class="labels">Resume</p>
				</div>
				<div id="portfolio" onclick="openWindow('portfolio')" >
					<img class="desktop-icon" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='7' width='10' height='4' fill='%23ffd84d' stroke='%23000'/%3E%3Crect x='3' y='10' width='26' height='16' fill='%23ffe666' stroke='%23000'/%3E%3C/svg%3E" data-src="https://i.ibb.co/cK0MdtFH/portfolio.png" data-fallback="portfolio" alt="Portfolio" width="46" height="46">
					<p class="labels">Portfolio</p>
				</div>
				<div id="contact" onclick="openWindow('contact')" >
					<img class="desktop-icon" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='7' width='26' height='18' fill='%23fff' stroke='%23000'/%3E%3Cpath d='M3 7 L16 17 L29 7' fill='none' stroke='%23000080' stroke-width='2'/%3E%3C/svg%3E" data-src="https://i.ibb.co/7tHQW7fM/contact.png" data-fallback="contact" alt="Contact" width="46" height="46">
					<p class="labels">Contact</p>
				</div>
				<div id="game" onclick="openWindow('minesweeper')" >
					<img class="desktop-icon" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='2' width='28' height='28' fill='%23c0c0c0' stroke='%23808080'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23000'/%3E%3Crect x='13' y='12' width='3' height='3' fill='%23fff'/%3E%3C/svg%3E" data-src="https://i.ibb.co/cKMbvwFX/minesweeper.png" data-fallback="minesweeper" alt="Minesweeper" width="46" height="46">
					<p class="labels">Minesweeper</p>
				</div>
			</div>
			<div id="applications">
				<div class="window draggable-window" id="default-window">
					<div class="title-bar" onmousedown="startDrag(event, 'default-window')">
						<div class="title-bar-text"></div>
						<div class="title-bar-controls">
							<button aria-label="Minimize" class="titleButtons" onclick="minimizeWindow('default-window')"></button>
							<button aria-label="Maximize" class="titleButtons" onclick="maximizeWindow('default-window')"></button>
							<button aria-label="Close" class="titleButtons" onclick="closeWindow('default-window')"></button>
						</div>
					</div>
					<div class="window-body">
						<p></p>
					</div>
				</div>
			</div>
			<div id="taskbar" class="window" role="tabpanel">
				<div id="taskbar-body" class="window-body">
					<div id="start">
						<button id="start-button" onclick="playSound()">
							<img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='9' y='6' width='9' height='9' fill='%23ff2a00'/%3E%3Crect x='20' y='8' width='9' height='9' fill='%2300b800'/%3E%3Crect x='8' y='17' width='9' height='9' fill='%230080ff'/%3E%3Crect x='19' y='19' width='9' height='9' fill='%23ffd800'/%3E%3C/svg%3E" data-src="https://i.ibb.co/Y48M26xH/start.png" data-fallback="start" alt="windows" width="27" height="27">
							&nbsp;
							Start
						</button>
					</div>
					<div class="status-bar">
						<div id="sound-and-time" class="status-bar-field">
							<img id="sound" onclick="changeImage()" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='5' y='12' width='5' height='8' fill='%23c0c0c0' stroke='%23000'/%3E%3Cpolygon points='10,12 18,6 18,26 10,20' fill='%23dfdfdf' stroke='%23000'/%3E%3Crect x='21' y='12' width='2' height='8' fill='%23000080'/%3E%3Crect x='25' y='9' width='2' height='14' fill='%23000080'/%3E%3C/svg%3E" data-src="https://i.ibb.co/WvVHbcB1/rays.png" data-fallback="rays" alt="Speaker" width="24" height="24" title="Toggle sound">
							<div id="clock" class="clock"></div>
						</div>
					</div>
				</div>
			</div>
		</div>
		<script src="scripts/fallbacks.js"></script>
		<script src="scripts/script.js"></script>
	</body>
</html>
